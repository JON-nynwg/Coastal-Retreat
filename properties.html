    <style>
        .filter-pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .filter-pill.active { background: var(--bs-primary); color: #fff; border-color: var(--bs-primary); }
        .pd-empty { text-align: center; padding: 60px 0; color: #777; }

        .pd-card { position: relative; }
        .pd-heart {
            position: absolute; top: 10px; right: 10px; z-index: 5;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px;
        }
        .pd-heart.saved { color: #ff4d6d; }
        .pd-avail-badge {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; color: #fff;
        }
        .pd-avail-badge.available { background: #1c8f5e; }
        .pd-avail-badge.booked { background: #b23b3b; }
        .pd-price-line { font-weight: 700; margin: 10px 0 2px; }
        .pd-price-line small { font-weight: 400; color: #888; font-size: 12px; }

        /* Modal */
        .pd-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(10,10,10,0.75);
            align-items: center; justify-content: center; z-index: 500; padding: 16px;
        }
        .pd-modal-overlay.open { display: flex; }
        .pd-modal {
            background: #fff; border-radius: 14px; max-width: 720px; width: 100%;
            max-height: 92vh; overflow-y: auto; position: relative;
        }
        .pd-modal-close {
            position: absolute; top: 14px; right: 14px; z-index: 10;
            background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%;
            width: 34px; height: 34px; font-size: 18px; cursor: pointer;
        }
        .pd-gallery-main { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 14px 14px 0 0; }
        .pd-gallery-thumbs { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; }
        .pd-gallery-thumbs img {
            width: 64px; height: 48px; object-fit: cover; border-radius: 6px; cursor: pointer;
            opacity: 0.6; flex-shrink: 0;
        }
        .pd-gallery-thumbs img.active { opacity: 1; outline: 2px solid var(--bs-primary); }
        .pd-modal-body { padding: 6px 24px 26px; }
        .pd-row { display: flex; gap: 18px; flex-wrap: wrap; margin: 10px 0 16px; font-size: 14px; color: #555; }
        .pd-section-title { font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: .03em; margin: 20px 0 8px; color: #333; }
        .pd-whatsapp-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: #25D366; color: #fff; padding: 12px 22px; border-radius: 8px;
            font-weight: 700; text-decoration: none; border: none; cursor: pointer;
        }
        .pd-whatsapp-btn:hover { background: #1ebe57; color: #fff; }
        .pd-map-btn {
            display: inline-flex; align-items: center; gap: 6px;
            border: 1.5px solid var(--bs-primary); color: var(--bs-primary);
            padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px;
        }

        .pd-calc { background: #f7f5f1; border-radius: 10px; padding: 16px; margin-top: 10px; }
        .pd-calc label { font-size: 12.5px; font-weight: 600; display: block; margin-bottom: 4px; }
        .pd-calc input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
        .pd-calc-result { font-weight: 700; font-size: 15px; margin-top: 6px; }

        .pd-testimonial { background: #f7f5f1; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13.5px; }
        .pd-testimonial b { display: block; font-size: 12.5px; color: var(--bs-primary); margin-bottom: 2px; }

        .pd-similar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        @media (max-width: 600px) { .pd-similar-grid { grid-template-columns: 1fr; } }
        .pd-similar-card { cursor: pointer; }
        .pd-similar-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; }
        .pd-similar-card .n { font-size: 12.5px; font-weight: 700; margin-top: 4px; }

        /* Lead form */
        .pd-lead-form { background: #f7f5f1; border-radius: 10px; padding: 16px; margin-top: 18px; }
        .pd-lead-form input, .pd-lead-form textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 13.5px; margin-bottom: 10px; font-family: inherit;
        }
        .pd-lead-success { color: #1c8f5e; font-weight: 600; font-size: 13.5px; display: none; }
    </style>
</head>
